name: Docker

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
      - run: docker build -t xiao-edge-platform .
      - run: docker run --name xiao-test -d -p 8000:8000 xiao-edge-platform
      - run: sleep 5 && curl -f --max-time 10 http://localhost:8000/health
      - run: docker stop xiao-test && docker rm xiao-test
