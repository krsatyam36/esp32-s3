name: Firmware Build

on:
  push:
    paths:
      - "include/**"
      - "src/main.cpp"
      - "platformio.ini"
  pull_request:
    paths:
      - "include/**"
      - "src/main.cpp"
      - "platformio.ini"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create WiFi config for build
        run: cp src/config.example.h src/config.h
      - uses: kumekay/platformio-actions@v1
        with:
          command: run
