[project]
name = "xiao-esp32s3-edge"
version = "2.2.0"
description = "ESP32-S3 Edge Intelligence Platform — streaming, Vision LLM, semantic search, YOLO, AI features"
authors = [{name = "krsatyam36"}]
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
ai = [
    "ultralytics>=8.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.280",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RET"]
ignore = ["E501", "SIM101", "SIM102", "SIM105", "SIM108", "SIM114", "SIM115", "RET504", "RET505", "ARG001"]

[tool.ruff.lint.per-file-ignores]
"src/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
