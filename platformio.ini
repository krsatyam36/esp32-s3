[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; CRITICAL: Enable 8MB PSRAM for the camera buffer
; Without PSRAM, UXGA resolution fails and OV2640 falls back to VGA
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    esp32-camera@^2.0.0

board_build.partitions = partitions_ota.csv

extra_scripts =
    post:post_build_size.py

[env:seeed_xiao_esp32s3_debug]
extends = env:seeed_xiao_esp32s3
build_flags = 
    ${env:seeed_xiao_esp32s3.build_flags}
    -DDEBUG
    -DCORE_DEBUG_LEVEL=5
board_build.partitions = partitions_ota.csv

monitor_filters = time, esp32_exception_decoder
